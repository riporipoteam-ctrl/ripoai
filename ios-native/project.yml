name: AskAI
options:
  bundleIdPrefix: io.github.riporipoteam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  AskAI:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    dependencies:
      - target: AskAIWidget
        embed: true
      - target: AskAIBroadcast
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.riporipoteam.ripoai
        PRODUCT_NAME: AskAI
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "12"
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: "NO"

  AskAIWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.riporipoteam.ripoai.widget
        PRODUCT_NAME: AskAIWidget
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "12"
        INFOPLIST_FILE: Widget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: "NO"
        SKIP_INSTALL: "YES"

  AskAIBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.riporipoteam.ripoai.broadcast
        PRODUCT_NAME: AskAIBroadcast
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "12"
        INFOPLIST_FILE: Broadcast/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: "NO"
        SKIP_INSTALL: "YES"
