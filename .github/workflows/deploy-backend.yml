name: Deploy backend (Firestore rules + Worker)

# Deploys the Firestore security rules (which gate friend search/suggestions,
# requests, DMs and calls) and the integrations Worker. Runs on demand and when
# those files change. Needs repo secrets:
#   FIREBASE_TOKEN          (firebase login:ci)         — for the rules
#   CLOUDFLARE_API_TOKEN    + CLOUDFLARE_ACCOUNT_ID      — for the worker (optional)
on:
  workflow_dispatch:
  push:
    branches: ['claude/ripoai-web-app-U0rvk', 'main']
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'worker/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Deploy Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is not set. Run 'firebase login:ci' locally and add the token as a repo secret named FIREBASE_TOKEN."
            exit 1
          fi
          firebase deploy --only firestore:rules --project ripoai-dff5d --token "$FIREBASE_TOKEN" --non-interactive

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy integrations Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping worker deploy (rules still deployed)."
            exit 0
          fi
          cd worker
          npm install -g wrangler
          wrangler deploy
