name: Deploy RipoAI GitHub Pages Mirror

# Secondary mirror only. Canonical production deploys to Firebase Hosting at
# https://ripoai-dff5d.web.app/ and the APK loads that same origin.
on:
  push:
    branches: ['claude/ripoai-web-app-U0rvk', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-mirror
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Add this as a repo secret: Settings → Secrets and variables →
          # Actions → New repository secret → name VITE_GROQ_API_KEY.
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}
          VITE_NVIDIA_BASE: ${{ secrets.VITE_NVIDIA_BASE }}
          VITE_NVIDIA_API_KEY: ${{ secrets.VITE_NVIDIA_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-mirror
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
