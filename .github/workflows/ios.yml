name: Build iOS app

# Builds the RipoAI iOS app from the web app using Capacitor, on GitHub's
# macOS runners (which have Xcode). Run it from the Actions tab (Run workflow)
# or by pushing a tag like v1-ios.
#
# Honest caveat about signing:
#   Apple does NOT allow installing unsigned apps on a physical iPhone/iPad.
#   To run on a real device you need an Apple Developer account ($99/yr) and
#   code signing. This workflow therefore produces an UNSIGNED build for the
#   iOS Simulator (a .app you can run in Xcode's Simulator on a Mac) plus the
#   ready-to-open Xcode project as an artifact - open it in Xcode, set your
#   signing team, and Run to install on your own device.
#
#   The zero-cost, no-Mac path to "RipoAI on your iPhone" is the PWA:
#   open the deployed site in Safari -> Share -> "Add to Home Screen". It then
#   launches full-screen with the app icon, like a native app.

on:
  workflow_dispatch:
  push:
    tags: ['*-ios']
    branches: ['claude/ripoai-web-app-U0rvk']
    paths:
      - '.github/workflows/ios.yml'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - 'src/**'
      - 'tailwind.config.js'
      - 'vite.config.ts'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor iOS platform
        run: npm install @capacitor/ios@^6.2.1 --no-save

      - name: Build web app (root base, with AI proxy)
        env:
          VITE_BASE: '/'
          VITE_RIPOAI_PROXY_URL: ${{ vars.VITE_RIPOAI_PROXY_URL || secrets.VITE_RIPOAI_PROXY_URL || 'https://ripoai.netlify.app/.netlify/functions/ripoai-chat' }}
        run: npm run build

      - name: Add & sync iOS platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned app for the iOS Simulator
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package Simulator .app
        run: |
          cd ios/App/build/Build/Products
          APP_DIR=$(find . -name 'App.app' -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then echo "App.app not found"; exit 1; fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$GITHUB_WORKSPACE/RipoAI-iOS-Simulator.zip"

      - name: Package Xcode project (open in Xcode, sign, run on device)
        run: |
          ditto -c -k --sequesterRsrc --keepParent ios "$GITHUB_WORKSPACE/RipoAI-iOS-Xcode-project.zip"

      - name: Upload Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: RipoAI-iOS-Simulator
          path: RipoAI-iOS-Simulator.zip

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: RipoAI-iOS-Xcode-project
          path: RipoAI-iOS-Xcode-project.zip

      - name: Publish to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: RipoAI iOS (latest)
          files: |
            RipoAI-iOS-Simulator.zip
            RipoAI-iOS-Xcode-project.zip
          body: |
            RipoAI iOS build (unsigned).

            **On your iPhone, no Mac needed (easiest):** open the RipoAI site in
            Safari -> Share -> **Add to Home Screen**. It launches full-screen with
            the app icon, like a native app.

            **Run in the iOS Simulator (needs a Mac with Xcode):** download
            `RipoAI-iOS-Simulator.zip`, unzip, then in Terminal:
            `xcrun simctl install booted App.app && xcrun simctl launch booted io.github.riporipoteam.ripoai`

            **Install on your own device:** download `RipoAI-iOS-Xcode-project.zip`,
            unzip, open `App/App.xcworkspace` in Xcode, select your Signing Team
            under Signing & Capabilities, plug in your iPhone, and press Run.

            > Apple does not allow installing unsigned apps on a physical device -
            > device install requires an Apple Developer account and code signing.
