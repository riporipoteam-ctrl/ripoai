name: Apply Codex Update

on:
  workflow_dispatch:
  push:
    branches: ['claude/ripoai-web-app-U0rvk']
    paths:
      - '.github/workflows/codex-apply-update.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ripoai-web-app-U0rvk
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unpack update payload
        env:
          PAYLOAD_B64: >-
            …2993 tokens truncated…
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const zlib = require('zlib')
          const encoded = process.env.PAYLOAD_B64.replace(/\s/g, '')
          const payload = JSON.parse(zlib.gunzipSync(Buffer.from(encoded, 'base64')).toString('utf8'))
          for (const [file, content] of Object.entries(payload.files)) {
            fs.mkdirSync(path.dirname(file), { recursive: true })
            fs.writeFileSync(file, content, 'utf8')
          }
          fs.rmSync('.github/workflows/codex-apply-update.yml', { force: true })
          NODE

      - name: Commit unpacked update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          git commit -m "Add web image search and Expo iOS shell" -m "- add web-sourced image gallery previews with source links" -m "- harden generated image fallback against black/blank logo outputs" -m "- add Expo iOS wrapper with Liquid Glass support" || exit 0
          git push
