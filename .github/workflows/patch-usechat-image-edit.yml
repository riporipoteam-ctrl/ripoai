name: Patch image edit hook

on:
  push:
    branches:
      - claude/ripoai-web-app-U0rvk
    paths:
      - .github/workflows/patch-usechat-image-edit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ripoai-web-app-U0rvk
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch useChat image edit flow
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'src/hooks/useChat.ts'
          let s = fs.readFileSync(path, 'utf8')
          s = s.replace(
            "import { generateImage, styleSuffix, dimsFor } from '../lib/imagegen'",
            "import { editImage, generateImage, styleSuffix, dimsFor } from '../lib/imagegen'",
          )
          s = s.replace(
            "          baseUrl = editBase || (await generateImage(styledScene, { w, h }))",
            "          baseUrl = editBase\n            ? await editImage(styledScene, editBase, { w, h })\n            : await generateImage(styledScene, { w, h })",
          )
          fs.writeFileSync(path, s)
          fs.rmSync('.github/workflows/patch-usechat-image-edit.yml', { force: true })
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useChat.ts .github/workflows/patch-usechat-image-edit.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Connect uploaded image edits to NVIDIA worker"
            git push origin HEAD:claude/ripoai-web-app-U0rvk
          fi
