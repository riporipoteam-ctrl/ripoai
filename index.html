    <script>
      // Register the network-first service worker so installed web/APK shells
      // pull the latest deploy. A waiting worker is promoted immediately, then
      // the page reloads once when the fresh worker takes control.
      if ('serviceWorker' in navigator) {
        var __ripoRefreshing = false;
        function refreshOnce() {
          if (__ripoRefreshing) return;
          __ripoRefreshing = true;
          location.reload();
        }
        function promoteWaitingWorker(reg) {
          if (reg.waiting && navigator.serviceWorker.controller) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
        }
        function watchRegistration(reg) {
          promoteWaitingWorker(reg);
          reg.addEventListener('updatefound', function () {
            var worker = reg.installing;
            if (!worker) return;
            worker.addEventListener('statechange', function () {
              if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                worker.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
          setInterval(function () {
            reg.update().catch(function () {});
          }, 60000);
        }
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').then(watchRegistration).catch(function () {});
        });
        navigator.serviceWorker.addEventListener('controllerchange', refreshOnce);
      }
    </script>
    <script>
      // Auto-update: if a newer build has been deployed, reload to it once so
      // users never get stuck on a stale cached bundle.
      window.addEventListener('load', function () {
        setTimeout(function () {
          try {
            var running = '';
            var scripts = document.querySelectorAll('script[src]');
            for (var i = 0; i < scripts.length; i++) {
              if (scripts[i].src.indexOf('/assets/index-') > -1) { running = scripts[i].src; break; }
            }
            if (!running) return;
            fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' })
              .then(function (r) { return r.text(); })
              .then(function (html) {
                var m = html.match(/assets\/index-[^"']+\.js/);
                if (m && running.indexOf(m[0]) === -1) {
                  if (!sessionStorage.getItem('ripoai-upd')) {
                    sessionStorage.setItem('ripoai-upd', '1');
                    location.replace(location.pathname + '?u=' + Date.now() + location.hash);
                  }
                } else {
                  sessionStorage.removeItem('ripoai-upd');
                }
              })
              .catch(function () {});
          } catch (e) {}
        }, 1500);
      });
    </script>
