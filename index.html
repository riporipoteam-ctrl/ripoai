<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="RipoAI — your intelligent AI workspace for chat, research and building." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- iOS "Add to Home Screen" — makes RipoAI install & launch full-screen like a native app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RipoAI" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>RipoAI</title>
    <script src="https://js.puter.com/v2/"></script>
    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('ripoai-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Auto-update: if a newer build has been deployed, reload to it once so
      // users never get stuck on a stale cached bundle.
      window.addEventListener('load', function () {
        setTimeout(function () {
          try {
            var running = '';
            var scripts = document.querySelectorAll('script[src]');
            for (var i = 0; i < scripts.length; i++) {
              if (scripts[i].src.indexOf('/assets/index-') > -1) { running = scripts[i].src; break; }
            }
            if (!running) return;
            fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' })
              .then(function (r) { return r.text(); })
              .then(function (html) {
                var m = html.match(/assets\/index-[^"']+\.js/);
                if (m && running.indexOf(m[0]) === -1) {
                  if (!sessionStorage.getItem('ripoai-upd')) {
                    sessionStorage.setItem('ripoai-upd', '1');
                    location.replace(location.pathname + '?u=' + Date.now() + location.hash);
                  }
                } else {
                  sessionStorage.removeItem('ripoai-upd');
                }
              })
              .catch(function () {});
          } catch (e) {}
        }, 1500);
      });
    </script>
  </body>
</html>
